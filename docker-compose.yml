version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: jobtracker-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=jobtracker
    networks:
      - jobtracker-net

  # Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtracker-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URL=mongodb://mongodb:27017/jobtracker
      - JWT_SECRET=production_secret_key_change_in_real_env
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000,http://localhost:80
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - jobtracker-net

  # React Vite Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: jobtracker-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - jobtracker-net

networks:
  jobtracker-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
